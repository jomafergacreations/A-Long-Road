<style>
/* VOICE: compañero de partida, cálido, con brillo de neón pero ordenado
   IDEA: atardecer de Vice City: panel nocturno violeta con un sol retro que se llena con tu %; fichas claras como postales
   PICTURE: el sol con franjas del logo, que sube al abrir y se rellena al progresar, sobre palmeras que se mecen
   COLOUR and TYPE: noche violeta, magenta, rosa flamenco, naranja y oro de atardecer, turquesa para lo hecho; Anton + Archivo
   LAYOUT: tablet primero: panel lateral fijo + fichas en rejilla; en vertical/móvil el panel pasa arriba y las pestañas se pegan */
:root{color-scheme:light dark;
--bg:light-dark(#fff2ea,#110725);--card:light-dark(#fffaf6,#1c0f36);--ink:light-dark(#24103f,#fbeef8);
--mut:light-dark(#6f6386,#b5a7cf);--line:light-dark(#f4d8d3,#32204f);--pink:light-dark(#df1f68,#ff5d97);
--sun:#ff8a3d;--gold:#ffc94a;--mag:#c42a78;--sea:light-dark(#0b9c99,#39d6cf);--night:#170b33;--nightink:#fbeefa;
--grad:linear-gradient(90deg,#ff3f7f,#ff8a3d 60%,#ffc94a);
--sh:0 1px 0 var(--line),0 16px 32px -24px light-dark(#5a1a5e99,#000)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.num{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05}

.content{padding:calc(clamp(18px,3.5vw,44px) + env(safe-area-inset-top)) calc(clamp(16px,3.5vw,48px) + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) clamp(16px,3.5vw,48px);max-width:1180px;width:100%}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px;margin-bottom:6px}
h2{font-size:clamp(34px,4.6vw,50px);margin:0;background:linear-gradient(90deg,var(--ink) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:6px 0 16px;font-size:16px;max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px;position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 0}
.tools input{flex:1 1 240px}
input[type=search],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;transition:border-color .2s}
input[type=search]:focus,textarea:focus{border-color:var(--pink);outline:none}
.chip{font:inherit;font-size:15px;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;min-height:46px;cursor:pointer;transition:transform .15s,background .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.hot{background:var(--grad);border:0;color:#2a0b2a}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.grp{margin:26px 0 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.grp h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,var(--pink));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--pink)) 22%,transparent)}
.grp>span{color:var(--mut);font-size:14px;font-weight:700;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.req{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px 18px 12px;position:relative;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s}
.req::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c,var(--pink))}
.req.done::before{background:var(--sea)}
.req.done{box-shadow:var(--sh),inset 0 0 0 2px color-mix(in srgb,var(--sea) 40%,transparent)}
.reqtop{display:flex;justify-content:space-between;gap:12px;align-items:start}
.req .nm{font-weight:700;font-size:17px;line-height:1.3}
.num{font-size:26px;white-space:nowrap;text-align:right}
.num small{display:block;font-family:Archivo,sans-serif;font-size:12.5px;color:var(--mut);font-weight:600}
.req.done .num{color:var(--sea)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff8 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.req.done .bar i{background:var(--sea)}
.step{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto}
.step button{font:inherit;font-weight:800;font-size:20px;min-width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 10px;transition:transform .12s,border-color .2s}
.step button.sm{font-size:14px}
.step button:hover{border-color:var(--pink)}
.step button:active{transform:scale(.92)}
.step input:not(.ck){font:inherit;font-size:17px;font-weight:700;width:0;flex:1 1 90px;height:48px;text-align:center;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.auto{font-size:14px;color:var(--mut);margin-top:auto}
details.tip{margin-top:10px;font-size:14.5px;color:var(--mut);border-top:1px dashed var(--line);padding-top:4px}
details.tip summary{cursor:pointer;color:var(--pink);font-weight:700;min-height:40px;display:flex;align-items:center}
details.tip[open] summary~*{animation:up .3s both}
.list{list-style:none;margin:0;padding:6px 18px;background:var(--card);border-radius:20px;box-shadow:var(--sh);columns:2 330px;column-gap:36px}
.row{break-inside:avoid;border-bottom:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.row:last-child{border-bottom:0}
.list>.gh{column-span:all;break-inside:avoid;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:14px 0 6px;border-bottom:2px solid var(--line);font-size:17px}
.list>.gh:not(:first-child){margin-top:10px}
.gh .tag{margin:0}.ghn{margin-left:auto;color:var(--mut);font-weight:700;font-size:14px}
.row .nm{display:inline;font-weight:600;background:linear-gradient(var(--sea),var(--sea)) 0 58%/0 2px no-repeat;transition:background-size .35s,color .35s}
.row.done .nm{color:var(--mut);background-size:100% 2px}
.ds{color:var(--mut);font-size:14px;margin-top:2px}
.row small.en{display:block;color:var(--mut);font-size:12.5px;font-style:italic}
.row .ds{color:var(--ink);opacity:.82;font-size:14px;line-height:1.4;margin-top:3px}
.tag.mk{background:transparent;border:1px dashed var(--line);color:var(--mut);font-weight:600}
.obtx em{display:block;font-style:normal;color:#e6dbf5;font-size:13.5px;line-height:1.35;margin:4px 0 2px}
.obtx .tag.mk{border-color:#ffffff40;color:#d2c2ea}
details.help{margin:12px 0 4px}details.help summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:36px;display:flex;align-items:center}
details.help ul{margin:6px 0 2px;padding-left:20px}details.help li{margin:4px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:1px 8px;margin:4px 4px 0 0;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.p{background:var(--gold);color:#3a2400}.tag.s{background:#d6dbe6;color:#22283a}.tag.b{background:#eab08a;color:#3a1d06}.tag.pl{background:#9ff0ea;color:#063a38}
.ck{appearance:none;width:32px;height:32px;border:2.5px solid var(--mut);border-radius:10px;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--bg);transition:background .2s,border-color .2s}
.ck:checked{background:var(--sea);border-color:var(--sea);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.ck:checked::after{content:"";width:13px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes pop{40%{transform:scale(1.25)}}
.lab{display:contents;cursor:pointer}
.sp .nm,.sp .ds,.sp small.en,.sp .tag.mk{filter:blur(6px);cursor:pointer;user-select:none}
.note{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:16px;padding:14px 16px;font-size:14.5px;margin:14px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0 4px}
.mini div{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 16px}
.mini b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px}
.mini small{color:var(--mut);font-size:13.5px}
.mini .ok b{color:var(--sea)}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px 18px;margin:16px 0}
.panel h3{margin:0 0 6px;font-size:19px}
.panel .tools{position:static;padding:4px 0;margin:8px 0 0}
.save{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:9}
.save.on{opacity:.94;transform:none}
.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fx i{position:absolute;width:9px;height:14px;border-radius:2px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ginfo{margin:-4px 0 12px;color:var(--mut);font-size:14.5px;max-width:90ch}
.gsrc{display:block;margin-top:4px;font-size:13px}.gsrc a{color:var(--pink);font-weight:600}
details.mg{margin-top:6px;font-size:14px}
details.mg summary{cursor:pointer;color:var(--pink);font-weight:700;display:inline-flex;align-items:center;min-height:32px;list-style:none}
details.mg summary::before{content:"▸";margin-right:6px;transition:transform .2s}details.mg[open] summary::before{transform:rotate(90deg)}
details.mg p{margin:2px 0 4px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,var(--card));color:var(--ink);line-height:1.45}
.sp details.mg{filter:blur(6px)}
.news{position:fixed;z-index:14;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 36px));animation:newsin .6s cubic-bezier(.2,1.2,.4,1) both}
.news[hidden]{display:none}
@keyframes newsin{from{opacity:0;transform:translateY(40px) scale(.95)}}
.nin{border-radius:22px;padding:18px 20px;color:#fbeefa;background:linear-gradient(135deg,#2a0e4c,#6a1f7a 55%,#c42a78);box-shadow:0 24px 60px -20px #000,0 0 0 2px #ffc94a66}
.nt{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nd{display:block;font-weight:700;margin:6px 0 4px}
.nin ul{margin:4px 0 12px;padding-left:18px;font-size:14px;color:#e6dbf5}.nin li{margin:3px 0}
.nb{display:flex;gap:8px;flex-wrap:wrap}.nin .chip{background:#ffffff14;color:#fbeefa;border-color:#ffffff30}.nin .chip.hot{background:var(--grad);color:#2a0b2a;border:0}
.list>.heist{column-span:all;break-inside:avoid;margin:10px 0 12px;padding:0;border:0}
.heist details{border-radius:18px;overflow:hidden;background:linear-gradient(120deg,#1f0d42,#4a1760 55%,#8a2363);color:#fbeefa;box-shadow:0 14px 30px -18px #4a1760}
.heist.hdone details{background:linear-gradient(120deg,#0d3a3f,#13605f)}
.hs{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;cursor:pointer;list-style:none;min-height:84px}
.hs::-webkit-details-marker{display:none}
.hs .nm b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(26px,3.2vw,34px);line-height:1.05;letter-spacing:.01em}
.hs .nm small{display:block;color:#d2c2ea;font-size:13.5px;margin-top:2px}
.hbar{display:block;height:6px;border-radius:9px;background:#ffffff22;margin-top:10px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .5s}
.hdone .hbar i{background:#39d6cf}
.hring{width:58px;height:58px;border-radius:50%;display:grid;place-content:center;background:radial-gradient(closest-side,#1c0f36 76%,transparent 78% 100%),conic-gradient(#ffc94a var(--p),#ffffff26 0)}
.hring b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:17px;color:#fff}
.hdone .hring{background:radial-gradient(closest-side,#0d3a3f 76%,transparent 78% 100%),conic-gradient(#39d6cf var(--p),#ffffff26 0)}
.chev{width:14px;height:14px;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg);transition:transform .25s;margin:0 6px 6px 0}
details[open] .chev{transform:rotate(-135deg);margin:6px 6px 0 0}
.heist ul{list-style:none;margin:0;padding:4px 18px 8px;background:var(--card);color:var(--ink);columns:2 300px;column-gap:36px;counter-reset:p}
details[open] .heist ul,.heist details[open]>ul{animation:up .35s both}
.hs.sp .nm b,.hs.sp .nm small{filter:blur(7px)}
.obheist{grid-column:1/-1;border-radius:18px;background:linear-gradient(120deg,#ffffff10,#ff3f7f22);border:1.5px solid #ff8a3d66;padding:14px}
.obhh{display:flex;gap:14px;align-items:center;margin-bottom:12px}

 background:radial-gradient(90% 45% at 50% 100%,#ff3f7f66,transparent 70%),linear-gradient(180deg,#170b33,#2a0e4c 60%,#4d1860);animation:fade .4s both}
.ob[hidden]{display:none}

.obgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;margin:18px 0}

.obgrid button:hover{background:#ffffff1c;border-color:#ff8a3d}

.obbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

 case 'guias':return GUIDE.reduce((a,g)=>a+guideDone(g),0)+'/'+GUIDE.reduce((a,g)=>a+g.l.length,0);
 case 'desafios':return chalDone()+'/80';case 'trofeos':return TRO.filter((t,i)=>S.done['t'+i]).length+'/55';case 'armas':return ARM.reduce((a,[c,l])=>a+l.filter((x,i)=>S.done['a'+c+i]).length,0)+'/'+ARM.reduce((a,c)=>a+c[1].length,0);default:return ''}}
function tabs(){const t=$('#tabs');t.innerHTML=TABS.map(([k,n,ic])=>{const c=tabCount(k);return `<a href="#${k}" ${k===tab?'aria-current="page"':''}><i aria-hidden="true">${ic}</i>${n}${c?`<small>${c}</small>`:''}</a>`}).join('');const cur=t.querySelector('[aria-current]');if(cur&&tabs.last!==tab){tabs.last=tab;const l=cur.offsetLeft-t.clientWidth/2+cur.clientWidth/2;t.scrollTo({left:l,behavior:RM?'auto':'smooth'})}}
const match=t=>!q||t.toLowerCase().includes(q);
const tools=(ph,extra='')=>`<div class="tools"><input type="search" id="q" placeholder="${ph}" value="${esc(q)}">${['todo','pendiente','hecho'].map(f=>`<button class="chip" data-f="${f}" aria-pressed="${filt===f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}${extra}</div>`;
const showF=d=>filt==='todo'||(filt==='hecho'?d:!d);
const grp=(name,count,c)=>`<div class="grp"${c?` style="--c:${c}"`:''}><h3>${name}</h3><span>${count}</span></div>`;
const head=(t,sub)=>`<div class="vhead"><h2>${t}</h2></div><p class="sub">${sub}</p>`;
function ckRow(key,name,desc,tags,extra='',sub=''){const d=!!S.done[key];if(!showF(d)||!match(name+' '+desc+' '+sub))return '';
 return `<li class="row${d?' done':''}${extra}"><label class="lab"><input type="checkbox" class="ck" data-k="${key}" ${d?'checked':''}><div><span class="nm">${esc(name)}</span>${sub&&S.orig?`<small class="en">${esc(sub)}</small>`:''}${desc?`<div class="ds">${esc(desc)}</div>`:''}${tags||''}</div></label></li>`}
const dsc=e=>(DESC[e.en]||[''])[0];
const mg=e=>{const t=TIPS[e.en],g=MGUIDE[e.en],w=MW[e.en];if(!t&&!g&&!w)return '';return `<details class="mg"><summary>${w?'Guía y consejos':'Consejos'+(g?' y avisos':'')}</summary>${w?mwBlock(e,true):''}${t?`<p>${esc(t)}</p>`:''}${g?`<p class="mgw">${esc(g)}</p>`:''}</details>`};
const nx=e=>{const n=nextEntry();return n&&n.k===e.k?' next':''};
const mk=e=>(DESC[e.en]||[])[1];
const mtag=e=>mk(e)&&S.orig?`<span class="tag mk" title="Objetivo que verás en el mapa o el menú">◆ ${esc(mk(e))}</span>`:'';
const GC={'Historia y tareas':'var(--pink)','Exploración y actividades':'var(--sea)','Descubrimiento':'var(--sun)'};

function vChecklist(){let h=head('Checklist 100%','Los 35 requisitos de <b>A Long Road</b>. Nada es perdible: todo se puede terminar en juego libre tras la historia. Los trucos desactivan el guardado, no los uses.')+tools('Buscar requisito…');
 for(const g of Object.keys(GC)){const all=REQ.filter(x=>x[0]===g);let cards='';
  for(const [grp,id,nm,need,tot,m,tip] of all){const c=cur(id),ok=c>=need;if(!showF(ok)||!match(nm+' '+tip))continue;const step=m?5000:1;
   cards+=`<article class="req${ok?' done':''}" style="--c:${GC[g]}"><div class="reqtop"><div class="nm">${esc(nm)}</div><div class="num">${id==='story'?Math.floor(c*100)+'%':fmt(c,m)}<small>${id==='story'?'de la historia':'de '+fmt(need,m)+(tot!==need?' · hay '+fmt(tot,m):'')}</small></div></div>
   <div class="bar"><i style="width:${Math.min(c/need,1)*100}%"></i></div>
   ${id==='story'?`<div class="auto">${misDone()} de ${misTot} misiones principales. Se actualiza desde <a href="#historia" style="color:var(--pink)">Historia</a> o con «Actualizar por dónde voy».</div>`:id==='chal'?`<div class="auto">Se calcula desde la pestaña <a href="#desafios" style="color:var(--pink)">Desafíos</a>.</div>`:
   `<div class="step"><button data-r="${id}" data-d="-${step}" aria-label="Restar">−</button><input inputmode="numeric" data-ri="${id}" value="${c}" aria-label="${esc(nm)}"><button data-r="${id}" data-d="${step}" aria-label="Sumar">+</button>${m?`<button class="sm" data-r="${id}" data-d="25000">+25k</button>`:''}<button class="sm" data-r="${id}" data-set="${need}">Hecho</button></div>`}
   <details class="tip"><summary>Cómo conseguirlo</summary>${esc(tip)}</details></article>`}
  if(cards)h+=grp(g,all.filter(x=>cur(x[1])>=x[3]).length+'/'+all.length,GC[g])+`<div class="cards">${cards}</div>`}
 return h}

function curChapter(){for(let c=0;c<ST.length;c++)if(ALL.some(e=>e.c===c&&e.t!=='o'&&!S.done[e.k]))return c;return 9}
const WHO={J:'Jason',L:'Lucia',JL:'Jason y Lucia'};
function stTags(e,inH){const hd=e.h?ALL.filter(x=>x.h===e.h):[];const pos=e.h?hd.indexOf(e)+1:0;
 const ht=e.h?(pos===hd.length?'Golpe final':'Paso '+pos+' de '+(hd.length-1)):'';
 return `${inH?`<span class="tag ${pos===hd.length?'p':''}">${ht}</span>`:`<span class="tag">${e.c+1}.${e.i+1}</span>`}${e.who?`<span class="tag">${WHO[e.who]}</span>`:''}${e.t==='t'?'<span class="tag">Tarea</span>':''}${e.t==='o'?'<span class="tag">Opcional</span>':''}${e.h&&!inH?`<span class="tag ${e.h==='c'?'p':'pl'}">${HEISTS[e.h][0]} · ${ht.toLowerCase()}</span>`:''}`}
const openH=new Set();
function heistBlock(hk,hide){const l=ALL.filter(e=>e.h===hk),d=l.filter(e=>S.done[e.k]).length,rows=l.map(e=>ckRow(e.k,e.es,dsc(e),stTags(e,true)+mtag(e)+mg(e),(hide?' sp':'')+nx(e),e.en)).join('');if(!rows)return '';
 const open=openH.has(hk)||(!openH.has('x'+hk)&&d>0&&d<l.length)||!!q;
 return `<li class="heist${d>=l.length?' hdone':''}"><details data-h="${hk}" ${open?'open':''}><summary class="hs${hide?' sp':''}"><span class="hring" style="--p:${d/l.length*100}%"><b>${d}/${l.length}</b></span><span class="nm"><b>${HEISTS[hk][0]}</b><small>${S.orig?HEISTS[hk][1]+' · ':''}${l.length-1} preparativos y el golpe final</small><span class="hbar"><i style="width:${d/l.length*100}%"></i></span></span><span class="chev" aria-hidden="true"></span></summary><ul>${rows}</ul></details></li>`}

 let h=head('Historia',`${misTot} misiones principales y ${tt.length} tareas de historia (pagos, llamadas, preparativos de los golpes) en 5 capítulos. Activa «Nombres originales» si quieres ver también el nombre en inglés.`)
 +`<div class="tools" style="position:static;padding:0"><button class="chip hot" id="gonext">Ir a mi siguiente misión</button><button class="chip" id="where">Actualizar por dónde voy</button></div>`

 +`<details class="note help"><summary>¿Cómo sé en el juego si ya la he hecho?</summary><ul><li><b>Pendientes:</b> abre el mapa y pulsa el icono del <b>libro rosa</b>: despliega todas las misiones de historia que tienes disponibles. Si una no sale ahí y ya la conoces, está hecha.</li><li><b>Hechas:</b> en el menú de pausa, <b>Progreso › Resumen de la historia</b> muestra lo que ya has completado, aunque no deja repetirlo.</li><li><b>No se pueden rejugar:</b> GTA VI no tiene "repetir misión". Si quieres volver a una, guarda a mano antes (hay 15 ranuras).</li><li>Con «Nombres originales» activado verás también, con un <b>◆</b>, el objetivo con el que aparece cada misión en el mapa.</li></ul></details>`
 +tools('Buscar misión…',`<button class="chip" id="spoil" aria-pressed="${S.spoil}">Sin spoilers</button>`+`<button class="chip" id="orig" aria-pressed="${!!S.orig}">Nombres originales</button>`);
 ST.forEach((l,c)=>{const es=ALL.filter(e=>e.c===c),main=es.filter(e=>e.t==='m'),d=main.filter(e=>S.done[e.k]).length,hide=S.spoil&&c>cc;
  const seen=new Set();const rows=es.map(e=>{if(e.h){if(seen.has(e.h))return '';seen.add(e.h);return heistBlock(e.h,hide)}return ckRow(e.k,e.es,dsc(e),stTags(e)+mtag(e)+mg(e),(hide?' sp':'')+nx(e),e.en)}).join('');
  const col=['var(--sea)','var(--pink)','var(--sun)','var(--gold)','var(--pink)'][c],G=CHG[c];
  if(rows)h+=grp(hide?'Capítulo '+(c+1):`Capítulo ${c+1} · ${CHT[c][0]}`,d+'/'+main.length,col)
   +(hide||q?'':`<details class="chg" style="--c:${col}" ${c===cc&&!S.chgClosed?'open':''} data-ch="${c}"><summary>Guía del capítulo ${c+1}</summary><p style="margin:0 0 8px">${esc(G.res)}</p><div class="chgrid"><div><h4>Antes de avanzar</h4><ul>${G.antes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Se desbloquea</h4><ul>${G.desb.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Dinero</h4><ul>${G.dinero.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Recomendado</h4><ul>${G.recs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></details>`)
   +`<ul class="list">${rows}</ul>`});
 return h}

 +`<div class="mini"><div class="${strands>=7?'ok':''}"><b>${strands}/7</b><small>tramas confirmadas para el trofeo</small></div><div class="${dn>=tot?'ok':''}"><b>${dn}/${tot}</b><small>secundarias hechas</small></div></div>`

 const giver=(g,hide)=>{const rows=g.l.map(([id,es,en,nt,lost])=>ckRow(sfk(id),es,nt,lost?'<span class="tag p">Se puede perder</span>':'',hide?' sp':'',en)).join('');if(!rows)return '';

 const free=SFX.filter(g=>g.c===0);
 h+=sec('Cuando quieras · no dependen del capítulo',free.reduce((a,g)=>a+g.l.filter(m=>S.done[sfk(m[0])]).length,0)+'/'+free.reduce((a,g)=>a+g.l.length,0),'var(--sea)',free.map(g=>giver(g,false)).join(''));
 for(let c=1;c<=4;c++){const gs=SFX.filter(g=>g.c===c),hide=S.spoil&&c-1>cc;
  h+=sec(hide?'Capítulo '+c:`Capítulo ${c} · ${CHT[c-1][0]}`,gs.reduce((a,g)=>a+g.l.filter(m=>S.done[sfk(m[0])]).length,0)+'/'+gs.reduce((a,g)=>a+g.l.length,0),['var(--pink)','var(--sun)','var(--gold)','var(--pink)'][c-1],gs.map(g=>giver(g,hide)).join(''))}

 +tools('Buscar sitio, banda, zona…');

const COL=['#ff3f7f','#ff8a3d','#ffc94a','#39d6cf','#c42a78','#fff0a8'];
function burst(el,n=26){if(RM||!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+Math.min(r.height/2,40),fx=$('#fx');
 for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=x+'px';p.style.top=y+'px';p.style.background=COL[i%COL.length];fx.appendChild(p);
  const a=Math.random()*Math.PI*2,d=60+Math.random()*(n>30?260:120),dx=Math.cos(a)*d,dy=Math.sin(a)*d-80;
  p.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+160}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove()}}
function celebrate(sel,n){requestAnimationFrame(()=>burst(document.querySelector(sel),n))}

let ob={step:'ch',ch:0,sel:new Set(),res:null};
function applyPoint(ch,sel){const before=new Set(Object.keys(S.done).filter(k=>S.done[k]));let m=0,t=0;
 for(const e of ALL){if(e.t==='o')continue;let v=null;
  if(ch>=5||e.c<ch)v=true;else if(e.c===ch)v=sel.has(e.k);

 else if(b.id==='gonext'){const r=document.querySelector('.row.next');if(r){const d=r.closest('details');if(d)d.open=true;r.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})}}
 else if(b.dataset.done){const k=b.dataset.done;S.done[k]=true;const nt=syncTro();save();render();burst($('#ring'),30);if(nt)flash('Trofeo de historia marcado');checkAll()}
 else if(b.dataset.mc){const c=b.dataset.mc;mapOff.has(c)?mapOff.delete(c):mapOff.add(c);mapSel=-1;render()}
 else if(b.id==='mhide'){mapHide=!mapHide;mapSel=-1;render()}
 else if(b.dataset.z!=null){const z=+b.dataset.z;z?mapZoom(z):mapFit()}
 else if(b.classList.contains('x')&&b.closest('#minfo')){mapSel=-1;for(const x of document.querySelectorAll('#mk button.sel'))x.classList.remove('sel');mapInfo()}
 else if(b.dataset.gs){gsec=b.dataset.gs;render()}
 else if(b.id==='orig'){S.orig=!S.orig;save();render()}
 else if(b.id==='spoil'){S.spoil=!S.spoil;save();render()}
 else if(b.id==='reset'){$('#confirm').innerHTML='<p class="sub">¿Seguro? Se borra todo menos las notas.</p><button class="chip" id="reset2" aria-pressed="true">Sí, borrar</button> <button class="chip" id="cancel">Cancelar</button>'}
 else if(b.id==='reset2'){S.req={};S.done={};save();render()}
 else if(b.id==='cancel'){$('#confirm').innerHTML=''}
 else if(b.id==='exp'){const c=encode();$('#code').value=c;$('#code').select();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>flash('Código copiado'),()=>flash('Cópialo del recuadro'))}
 else if(b.id==='dl'){try{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='gta6-progreso-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){flash('Aquí no se puede descargar: usa Copiar código')}}
 else if(b.id==='imp'){$('#impmsg').textContent=load($('#code').value)?'Progreso importado':'Ese código no es válido'}});
V2.addEventListener('change',async e=>{if(e.target.id==='file'&&e.target.files[0]){const ok=load(await e.target.files[0].text());flash(ok?'Progreso importado':'Archivo no válido')}});
V2.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('chg')&&+d.dataset.ch===curChapter()){S.chgClosed=!d.open;return}if(!d.dataset||!d.dataset.h)return;const k=d.dataset.h;if(d.open){openH.add(k);openH.delete('x'+k)}else{openH.delete(k);openH.add('x'+k)}},true);
V2.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value.trim().toLowerCase();render(true)}else if(t.id==='notes'){S.notes=t.value;save()}});

route();
if(!S.setup)openOb();
function showNews(){const n=NEWS[0];if(!n||(S.newsSeen||'')>=n.d)return;const el=$('#news');
 el.innerHTML=`<div class="nin"><b class="nt">${esc(n.h||'Nuevo descubrimiento')}</b><span class="nd">${esc(n.t)}</span><ul>${n.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="nb"><button class="chip hot" id="nsee">${n.go==='inicio'?'Ver Inicio':'Ver guías'}</button><button class="chip" id="nclose">Entendido</button></div></div>`;el.hidden=false;if(!RM)setTimeout(()=>burst(el.querySelector('.nt'),24),400)}
$('#news').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.newsSeen=NEWS[0].d;save();$('#news').hidden=true;if(b.id==='nsee')location.hash='#'+(NEWS[0].go||'guias')});
setTimeout(showNews,S.setup?900:0);

/* ---------- GUARDADO EN LA CUENTA ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
(async()=>{try{
 if(typeof claude==='undefined'||!claude.use)return;
 const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;
 const id=await u.id();if(!id)return;db=d;docRef=db.collection('data/users/'+id).doc('progreso');
 let r=await docRef.get();const v=r&&(typeof r.data==='function'?r.data():(r.data!==undefined?r.data:r));
 if(v&&v.v&&(v.ts||0)>(S.ts||0)){S=migrate(Object.assign({v:1,ts:0,req:{},done:{},notes:'',spoil:true},v));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render();if(S.setup&&ob.step==='ch')closeOb()}
 else if(S.ts)save();
}catch(e){}})();
}
</script>
</body>
</html>
